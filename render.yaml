services:
  - type: web
    name: documind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GENERATIVE_MODEL
        value: gemini-3.6-flash
      - key: CORS_ORIGINS
        value: '["http://localhost:5173", "http://localhost:3000", "https://*.vercel.app"]'
