name: KueryCore AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kuerycore
          POSTGRES_USER: kuerycore
          POSTGRES_PASSWORD: kuerycore_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL_SYNC: postgresql://kuerycore:kuerycore_dev@localhost:5432/kuerycore
      DATABASE_URL: postgresql+asyncpg://kuerycore:kuerycore_dev@localhost:5432/kuerycore
      ENVIRONMENT: development
      JWT_SECRET_KEY: ci-test-secret-do-not-use-in-production
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-dummy-gemini-key' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test-dummy-groq-key' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Validate Eval Golden Set Schema
        run: |
          cd backend
          python scripts/run_eval.py --validate-golden

      - name: Run Pytest Test Suite
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Build Frontend Application
        env:
          VITE_API_URL: "http://localhost:8000"
        run: |
          cd frontend
          npm run build
